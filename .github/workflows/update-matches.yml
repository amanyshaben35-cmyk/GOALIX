name: Update GOALIX Matches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Egypt date
        id: date
        run: |
          echo "today=$(TZ=Africa/Cairo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch today's matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |

          mkdir -p data

          curl -fLsS \
            --url "https://v3.football.api-sports.io/fixtures?date=${TODAY}&timezone=Africa/Cairo" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            -o data/all-matches.json

      - name: Validate GOALIX data
        run: |

          python3 - <<'PY'

          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          file = Path("data/all-matches.json")

          data = json.loads(
              file.read_text(
                  encoding="utf-8"
              )
          )

          if data.get("errors"):
              raise SystemExit(
                  f"API error: {data['errors']}"
              )

          response = data.get("response", [])

          egypt_matches = []

          for item in response:

              league = item.get("league", {})

              if league.get("id") == 141:
                  egypt_matches.append(item)

          data["results"] = len(response)

          data["updated"] = datetime.now(
              ZoneInfo("Africa/Cairo")
          ).isoformat()

          file.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"GOALIX TOTAL MATCHES: {len(response)}"
          )

          print(
              f"EGYPTIAN PREMIER LEAGUE MATCHES: {len(egypt_matches)}"
          )

          for match in egypt_matches:

              teams = match.get("teams", {})

              home = teams.get("home", {}).get(
                  "name",
                  "Unknown"
              )

              away = teams.get("away", {}).get(
                  "name",
                  "Unknown"
              )

              print(
                  f"EGYPT: {home} vs {away}"
              )

          PY

      - name: Save updated data
        run: |

          git config user.name "GOALIX Bot"

          git config user.email "actions@github.com"

          git add data/all-matches.json

          git commit \
            -m "Update GOALIX matches" \
            || echo "No changes"

          git push
