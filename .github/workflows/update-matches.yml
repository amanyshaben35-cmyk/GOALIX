name: Update GOALIX Matches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get today's date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch football matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          mkdir -p data

          curl -s \
            --url "https://v3.football.api-sports.io/fixtures?date=${TODAY}" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            -o data/all-matches.json

      - name: Create GOALIX data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          source = Path("data/all-matches.json")

          try:
              data = json.loads(source.read_text())
          except Exception:
              data = {}

          matches = data.get("response", [])

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "matches": matches
          }

          Path("data/matches.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2)
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "GOALIX Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GOALIX match data"
            git push
          fi
