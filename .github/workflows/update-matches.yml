name: Update GOALIX Matches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Egypt date
        id: date
        run: |
          echo "today=$(TZ=Africa/Cairo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # =========================
      # مباريات اليوم
      # =========================

      - name: Fetch today's matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |

          mkdir -p data

          curl -fLsS \
            --url "https://v3.football.api-sports.io/fixtures?date=${TODAY}&timezone=Africa/Cairo" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            -o data/all-matches.json

      # =========================
      # إضافة الدوري المصري
      # =========================

      - name: Fetch Egyptian Premier League
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |

          curl -fLsS \
            --url "https://v3.football.api-sports.io/fixtures?league=141&season=2026&date=${TODAY}&timezone=Africa/Cairo" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            -o data/egypt-matches.json

      # =========================
      # دمج البيانات
      # =========================

      - name: Merge GOALIX data
        run: |

          python3 - <<'PY'

          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          main_file = Path("data/all-matches.json")
          egypt_file = Path("data/egypt-matches.json")

          main = json.loads(
              main_file.read_text(
                  encoding="utf-8"
              )
          )

          egypt = json.loads(
              egypt_file.read_text(
                  encoding="utf-8"
              )
          )

          if main.get("errors"):
              raise SystemExit(
                  f"Main API error: {main['errors']}"
              )

          if egypt.get("errors"):
              raise SystemExit(
                  f"Egypt API error: {egypt['errors']}"
              )

          existing_ids = {
              item.get("fixture", {}).get("id")
              for item in main.get("response", [])
          }

          added = 0

          for item in egypt.get("response", []):

              fixture_id = item.get(
                  "fixture", {}
              ).get("id")

              if fixture_id not in existing_ids:

                  main.setdefault(
                      "response", []
                  ).append(item)

                  added += 1

          main["results"] = len(
              main.get("response", [])
          )

          main["updated"] = datetime.now(
              ZoneInfo("Africa/Cairo")
          ).isoformat()

          main_file.write_text(
              json.dumps(
                  main,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"GOALIX: added {added} Egyptian matches"
          )

          print(
              f"GOALIX TOTAL: {len(main.get('response', []))}"
          )

          PY

      # =========================
      # حفظ البيانات
      # =========================

      - name: Save updated data
        run: |

          git config user.name "GOALIX Bot"

          git config user.email "actions@github.com"

          git add data/all-matches.json

          git commit \
            -m "Update GOALIX matches" \
            || echo "No changes"

          git push
