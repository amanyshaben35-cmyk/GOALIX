name: Update GOALIX Matches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Egypt date
        id: date
        run: echo "today=$(TZ=Africa/Cairo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          mkdir -p data

          curl -sS \
            --url "https://v3.football.api-sports.io/fixtures?date=${TODAY}&timezone=Africa/Cairo" \
            --header "x-apisports-key: ${API_FOOTBALL_KEY}" \
            -o data/all-matches.json

      - name: Build data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/all-matches.json").read_text())
          matches = data.get("response", [])

          print("MATCHES:", len(matches))

          Path("data/matches.json").write_text(
              json.dumps(
                  {"matches": matches},
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Save
        run: |
          git config user.name "GOALIX Bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Update GOALIX matches" || true
          git push
